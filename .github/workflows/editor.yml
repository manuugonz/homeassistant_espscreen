# The editor (web/) is shipped built, in screen_manager/app/static: the add-on's image copies it as it is and builds
# nothing. Whenever the editor's sources change on main, this builds it (npm run build checks the types first, so a
# change that does not hold commits nothing) and commits the result to the same branch.
name: Editor

on:
  push:
    branches: [main]
    paths:
      - "web/src/**"
      - "web/index.html"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/vite.config.ts"
      - ".github/workflows/editor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: editor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the editor
        working-directory: web
        run: npm ci && npm run build
      - name: Commit the built editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screen_manager/app/static
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Editor: rebuilt for ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
