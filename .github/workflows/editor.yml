# The editor (web/) is shipped built, in screen_manager/app/static: the add-on's image copies it as it is and builds
# nothing. Whenever the editor's sources change on main, this tests and builds it (npm run build checks the types
# first, so a change that does not hold commits nothing) and commits the result to the same branch. Run by hand, it
# does the same for the branch named (a branch for a pull request, as AGENTS.md asks for the built editor with it).
name: Editor

on:
  push:
    branches: [main]
    paths:
      - "web/src/**"
      - "web/index.html"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/vite.config.ts"
      - ".github/workflows/editor.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch to test, build and commit the editor on"
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: editor-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  editor:
    name: editor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build the editor
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Commit the built editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screen_manager/app/static
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Editor: the built editor (screen_manager/app/static) for $(git rev-parse --short HEAD)"
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
